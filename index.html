<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Grimorio — Collezione Magic</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12181A" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grimorio" />

  <style>
    html, body { margin: 0; padding: 0; background: #12181A; height: 100%; }
    #root { min-height: 100vh; }
    #boot-error {
      display: none;
      font-family: monospace;
      color: #ffb4a3;
      background: #1a1010;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>

  <script>
    window.addEventListener("error", function (e) {
      var box = document.getElementById("boot-error");
      if (!box) return;
      box.style.display = "block";
      box.textContent += "Errore: " + e.message + "\n(file: " + (e.filename || "?") + ", riga: " + (e.lineno || "?") + ")\n\n";
    });
  </script>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="boot-error"></div>
  <div id="root">
    <div style="color:#8B9490;font-family:sans-serif;padding:20px;font-size:14px;">
      Caricamento dell'app… se questo messaggio non sparisce entro pochi secondi, uno degli script esterni non si è caricato (controlla la connessione e riprova).
    </div>
  </div>

  <script type="text/babel" data-presets="react" src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
